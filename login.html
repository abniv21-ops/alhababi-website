<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — alhababi.website</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='https://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg: #0b0f1a;
            --bg-card: rgba(15, 23, 42, 0.6);
            --bg-toggle: rgba(255, 255, 255, 0.06);
            --bg-toggle-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(99, 102, 134, 0.12);
            --text-primary: #e8eaf0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --shadow-card: 0 24px 80px -16px rgba(0,0,0,0.4);
            --grid-line: rgba(255,255,255,0.015);
            --feature-bg: rgba(255,255,255,0.02);
            --feature-border: rgba(255,255,255,0.04);
            --input-bg: rgba(255,255,255,0.04);
            --input-border: rgba(255,255,255,0.08);
            --input-focus: rgba(255,255,255,0.12);
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg: #f8f9fc;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-toggle: rgba(0, 0, 0, 0.05);
            --bg-toggle-hover: rgba(0, 0, 0, 0.08);
            --border: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1a2e;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --shadow-card: 0 24px 80px -16px rgba(0,0,0,0.08);
            --grid-line: rgba(0,0,0,0.02);
            --feature-bg: rgba(0,0,0,0.02);
            --feature-border: rgba(0,0,0,0.04);
            --input-bg: rgba(0,0,0,0.03);
            --input-border: rgba(0,0,0,0.08);
            --input-focus: rgba(0,0,0,0.12);
        }

        :root {
            --coral: #ff6b6b;
            --coral-glow: rgba(255, 107, 107, 0.08);
            --teal: #2dd4bf;
            --teal-glow: rgba(45, 212, 191, 0.08);
            --violet: #a78bfa;
            --violet-glow: rgba(167, 139, 250, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* RTL Support */
        [dir="rtl"] {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
        }

        /* Background */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            transition: opacity 0.4s ease;
        }

        [data-theme="light"] .bg-effects { opacity: 0.5; }

        .bg-effects .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.10;
            animation: float 25s ease-in-out infinite;
        }

        .orb-1 {
            width: 700px;
            height: 700px;
            background: var(--coral);
            top: -300px;
            right: -200px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--teal);
            bottom: -200px;
            left: -100px;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: var(--violet);
            top: 40%;
            left: 50%;
            animation-delay: -16s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.05); }
            50% { transform: translate(-30px, 40px) scale(0.95); }
            75% { transform: translate(20px, -20px) scale(1.03); }
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(ellipse at 50% 30%, black 10%, transparent 65%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 10%, transparent 65%);
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 0;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-toggle);
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .toggle-btn:hover {
            background: var(--bg-toggle-hover);
            color: var(--text-primary);
        }

        .toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-toggle);
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .lang-btn:hover {
            background: var(--bg-toggle-hover);
            color: var(--text-primary);
        }

        /* Theme icon toggle */
        .theme-icon-sun, .theme-icon-moon { display: none; }
        [data-theme="dark"] .theme-icon-sun { display: block; }
        [data-theme="light"] .theme-icon-moon { display: block; }

        /* Login Container */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.8s ease 0.1s both;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, transparent 30%, rgba(167, 139, 250, 0.25));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .login-card h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--coral) 0%, var(--violet) 50%, var(--teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [dir="rtl"] .login-card h1 {
            letter-spacing: 0;
        }

        .login-subtitle {
            font-size: 0.92rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: color 0.3s;
            pointer-events: none;
        }

        [dir="rtl"] .input-wrapper svg {
            left: auto;
            right: 16px;
        }

        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 16px 0 48px;
            border-radius: 14px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            transition: all 0.3s ease;
            outline: none;
        }

        [dir="rtl"] .form-input {
            padding: 0 48px 0 16px;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--violet);
            background: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .form-input:focus + svg,
        .form-input:focus ~ svg {
            color: var(--violet);
        }

        .input-wrapper:focus-within svg {
            color: var(--violet);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.3s;
        }

        [dir="rtl"] .password-toggle {
            right: auto;
            left: 16px;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .password-toggle svg {
            position: static;
            width: 18px;
            height: 18px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .remember-me input[type="checkbox"]:checked {
            background: var(--violet);
            border-color: var(--violet);
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 6px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .remember-me span {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 0.82rem;
            color: var(--violet);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .forgot-link:hover {
            opacity: 0.8;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--coral) 0%, var(--violet) 50%, var(--teal) 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--coral) 0%, var(--violet) 50%, var(--teal) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: brightness(1.2);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(167, 139, 250, 0.4);
        }

        .login-btn:hover::before {
            opacity: 1;
        }

        .login-btn span {
            position: relative;
            z-index: 1;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .signup-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .signup-text a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .signup-text a:hover {
            opacity: 0.8;
        }

        /* Error message */
        .error-message {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeInUp 0.3s ease;
        }

        .error-message.show {
            display: flex;
        }

        .error-message svg {
            width: 18px;
            height: 18px;
            color: var(--coral);
            flex-shrink: 0;
        }

        .error-message span {
            font-size: 0.82rem;
            color: var(--coral);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        footer p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .footer-links a:hover { color: var(--text-secondary); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .wrapper { padding: 0 20px; }
            nav { padding: 20px 0; }
            .login-card { padding: 36px 24px; }
            .login-container { padding: 40px 0; }
            footer { flex-direction: column; gap: 16px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-bg"></div>

    <div class="wrapper">
        <nav>
            <a href="/" class="logo">alhababi</a>
            <div class="nav-controls">
                <button class="lang-btn" id="langToggle" title="Switch language">AR</button>
                <button class="toggle-btn" id="themeToggle" title="Toggle theme">
                    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </nav>

        <div class="login-container">
            <div class="login-card">
                <div class="login-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>

                <h1 data-en="Welcome Back" data-ar="مرحباً بعودتك">Welcome Back</h1>
                <p class="login-subtitle" data-en="Sign in to your account to continue" data-ar="سجّل دخولك للمتابعة">Sign in to your account to continue</p>

                <div class="error-message" id="errorMessage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="errorText" data-en="Invalid email or password" data-ar="البريد الإلكتروني أو كلمة المرور غير صحيحة">Invalid email or password</span>
                </div>

                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label data-en="Email" data-ar="البريد الإلكتروني">Email</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input type="email" class="form-input" id="email" required autocomplete="email"
                                   placeholder="you@example.com"
                                   data-placeholder-en="you@example.com"
                                   data-placeholder-ar="you@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label data-en="Password" data-ar="كلمة المرور">Password</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" class="form-input" id="password" required autocomplete="current-password"
                                   style="padding-right: 48px"
                                   placeholder="••••••••"
                                   data-placeholder-en="••••••••"
                                   data-placeholder-ar="••••••••">
                            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span data-en="Remember me" data-ar="تذكرني">Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" data-en="Forgot password?" data-ar="نسيت كلمة المرور؟">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <span data-en="Sign In" data-ar="تسجيل الدخول">Sign In</span>
                    </button>
                </form>

                <div class="divider">
                    <span data-en="or" data-ar="أو">or</span>
                </div>

                <p class="signup-text">
                    <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
                    <a href="#" data-en="Sign up" data-ar="سجّل الآن">Sign up</a>
                </p>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Alhababi. <span data-en="All rights reserved." data-ar="جميع الحقوق محفوظة.">All rights reserved.</span></p>
            <div class="footer-links">
                <a href="/" data-en="Home" data-ar="الرئيسية">Home</a>
                <a href="mailto:contact@alhababi.website" data-en="Contact" data-ar="تواصل">Contact</a>
            </div>
        </footer>
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        // Language toggle
        const langToggle = document.getElementById('langToggle');
        let currentLang = localStorage.getItem('lang') || 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            html.setAttribute('lang', lang);
            html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            langToggle.textContent = lang === 'en' ? 'AR' : 'EN';

            document.querySelectorAll('[data-' + lang + ']').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (el.tagName === 'H1' || el.innerHTML.includes('<span')) {
                    el.innerHTML = text;
                } else {
                    el.textContent = text;
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-placeholder-' + lang + ']').forEach(el => {
                el.placeholder = el.getAttribute('data-placeholder-' + lang);
            });
        }

        setLanguage(currentLang);

        langToggle.addEventListener('click', () => {
            setLanguage(currentLang === 'en' ? 'ar' : 'en');
        });
